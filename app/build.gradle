plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.gjr787878.screenshotx'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.screenshotx"
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            if (System.getenv("DRS_KEYSTORE_PATH")) {
                storeFile rootProject.file(System.getenv("DRS_KEYSTORE_PATH"))
                storePassword "DRS_Key_2026!"
                keyAlias "devicereset"
                keyPassword "DRS_Key_2026!"
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("DRS_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.github.GJR787878:GlassButtons:v1.0.5'
}
