plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.gjr787878.screenshotx'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.screenshotx"
        minSdk 31
        targetSdk 34
        versionCode 6
        versionName "1.0.5"
    }

    signingConfigs {
        fixed {
            storeFile file('mykey.jks')
            storePassword 'password'
            keyAlias 'key0'
            keyPassword 'password'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    compileOnly 'de.robv.android.xposed:api:82'
}
