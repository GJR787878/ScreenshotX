name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'latest_version.txt' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Verify signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotX-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenshotX ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
